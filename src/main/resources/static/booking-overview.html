<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookingoversigt – Adventure XP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/williamtroup/Calendar.js@2.12.6/dist/calendar.js.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav aria-label="Hovedmenu">
    <a href="/">Adventure XP</a>
    <a href="/">Forside</a>
    <a href="/booking-overview.html">Bookingoversigt</a>
</nav>

<main>
    <h1>Bookingoversigt</h1>

    <button type="button" onclick="location.reload()">
        Genindlæs bookinger
    </button>

    <p id="booking-count"></p>
    <div id="booking-calendar"></div>
</main>

<script src="https://cdn.jsdelivr.net/gh/williamtroup/Calendar.js@2.12.6/dist/calendar.min.js"></script>

<script>
    async function loadBookingCalendar() {
        const response = await fetch(
            "/adventureexperience/bookings",
            { cache: "no-store" }
        );

        const bookings = await response.json();

        const events = bookings.map(booking => ({
            id: String(booking.bookingId),
            from: new Date(booking.startTime),
            to: new Date(booking.endTime),
            title: booking.activityName + " · " + booking.employeeName,
            description:
                "Dato: " + booking.bookingDate +
                "\nTid: " + booking.startTime.substring(11, 16) +
                " – " + booking.endTime.substring(11, 16),
            group: booking.employeeName,
            isAllDay: false,
            repeatEvery: 0,
            showAlerts: false
        }));

        const calendar = new calendarJs("booking-calendar", {
            manualEditingEnabled: false,
            dragAndDropForEventsEnabled: false,
            autoRefreshTimerDelay: 0,
            allowHtmlInDisplay: false
        });

        calendar.setEvents(events);

        document.getElementById("booking-count").textContent =
            bookings.length + " bookinger";
    }

    loadBookingCalendar();

    // Reload if Back/Forward restores an old browser snapshot.
    window.addEventListener("pageshow", event => {
        if (event.persisted) {
            location.reload();
        }
    });
</script>

</body>
</html>
