spring:
  datasource:
    url: jdbc:h2:mem:adventurexp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:h2init.sql
      data-locations: classpath:data-test.sql
  h2:
    console:
      enabled: true
