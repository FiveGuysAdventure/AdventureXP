spring:
  datasource:
    url: jdbc:h2:mem:adventurexp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      # Change to "always" once h2-test-schema.sql and test-data.sql contain SQL (Spring fails on scripts with no statements)
      mode: never
      schema-locations: classpath:h2-test-schema.sql
      data-locations: classpath:test-data.sql
  h2:
    console:
      enabled: true
