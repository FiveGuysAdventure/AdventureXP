     spring:
        datasource:
          url: jdbc:h2:mem:adventurexp_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
          username: sa
          password:
          driver-class-name: org.h2.Driver

        jpa:
          hibernate:
            ddl-auto: create-drop
          defer-datasource-initialization: true
          show-sql: true
          properties:
            hibernate:
              format_sql: true

        sql:
          init:
            mode: always
            data-locations: classpath:data-test.sql

        h2:
          console:
            enabled: true