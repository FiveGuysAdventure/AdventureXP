spring:
  datasource:
    url: jdbc:h2:mem:adventurexp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop


    # Hibernate has to create the tables BEFORE data-test.sql runs
    defer-datasource-initialization: true

    show-sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql